// Надстройка для совместимости новой версии gradle 9.7.1 и liquibase.gradle 3.1.0
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.3'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'org.liquibase.gradle' version '3.1.0'
}

group = 'org.lab'
version = '0.0.1-SNAPSHOT'
description = 'kpoproject'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    timestamp = new Date().format("yyyy-MM-dd-HHmmss")
}

configurations {
    liquibaseRuntime.extendsFrom runtimeClasspath
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.liquibase:liquibase-core'

    compileOnly 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testCompileOnly 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testAnnotationProcessor 'org.projectlombok:lombok'

    liquibaseRuntime 'org.liquibase:liquibase-core:5.0.3'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate7:5.0.3'
    liquibaseRuntime 'com.h2database:h2'
    liquibaseRuntime 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
    liquibaseRuntime sourceSets.main.runtimeClasspath
    liquibaseRuntime sourceSets.main.output
}


// Настройка liquibase
liquibase {
    activities {
        main {
            changelogFile "db/changelog/db.changelog-master.yaml"
            url project.findProperty('db.url')
            username project.findProperty('db.username')
            password project.findProperty('db.password')
            referenceUrl "hibernate:spring:org.lab.liqubasetreaning?dialect=org.hibernate.dialect.H2Dialect"
            logLevel project.findProperty('db.logLevel')
        }
    }
}

tasks.register("generateDiff") {
    group = "liquibase"
    description = "Generate diff between DB and JPA entities"
    doFirst() {
        liquibase {
            activities {
                main {
                    changelogFile "src/main/resources/db/changes/generated-diff-${timestamp}.yml"
                }
            }
        }
    }
    finalizedBy diffChangelog
}
diffChangelog.dependsOn compileJava

// Блок для checkstyle
checkstyle {
    toolVersion = '12.1.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    reportsDir = file('config/reports/')
    maxErrors = 0
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.register('checkAll') {
    dependsOn(tasks.named("checkstyleMain"), tasks.named("checkstyleTest"))
}

tasks.named('test') {
    useJUnitPlatform()
}


